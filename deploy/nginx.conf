# nginx.conf — конфигурация для продакшна на TimeWeb
# Расположение на сервере: /etc/nginx/sites-available/bookings
# Символическая ссылка: /etc/nginx/sites-enabled/bookings
#
# Замени yourdomain.ru на реальный домен перед деплоем

# Редирект HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.ru api.yourdomain.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS сервер — API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.ru;

    # SSL (certbot заполнит эти пути автоматически)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Безопасность
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Лимиты
    client_max_body_size 5M;

    # Логи
    access_log /var/log/nginx/bookings-access.log;
    error_log  /var/log/nginx/bookings-error.log;

    # Прокси на FastAPI (uvicorn слушает :8001)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # WebSocket support (на будущее)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Статика фронтенда (собранный React)
    location / {
        root  /var/www/app/vk-table-booking/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Кэширование статических ресурсов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check без логирования (чтобы не засорять логи мониторингом)
    location = /api/health {
        proxy_pass http://127.0.0.1:8001;
        access_log off;
    }
}

